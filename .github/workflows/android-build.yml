name: Android Build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
      ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
      ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
      ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;34.0.0" \
            "cmake;3.22.1" \
            "ndk;29.0.14033849"

      - name: Decode release keystore
        run: |
          if [[ -n "${ANDROID_RELEASE_KEYSTORE_BASE64}" ]]; then
            echo "${ANDROID_RELEASE_KEYSTORE_BASE64}" | base64 --decode > "${RUNNER_TEMP}/android-release.keystore"
          else
            echo "No release keystore secret configured; the release APKs will be signed with the debug key." >&2
          fi

      - name: Build release APKs
        env:
          ANDROID_RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/android-release.keystore
        run: bash ./gradlew --no-daemon :app:assembleRelease

      - name: Report built APKs
        run: |
          shopt -s nullglob
          APKS=(app/build/outputs/apk/release/*.apk)
          if (( ${#APKS[@]} == 0 )); then
            echo "No APKs were produced" >&2
            exit 1
          fi
          for apk in "${APKS[@]}"; do
            printf '%s (%s bytes)\n' "$(basename "${apk}")" "$(stat -c%s "${apk}")"
          done

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: rfm-radio-apks
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Resolve release tag
        if: startsWith(github.ref, 'refs/tags/v')
        id: release_tag
        run: |
          TAG="${GITHUB_REF_NAME}"
          GRADLE_VERSION="$(sed -nE 's/^def version(Major|Minor|Patch) = ([0-9]+)$/\2/p' app/build.gradle | paste -sd. -)"
          if [[ "v${GRADLE_VERSION}" != "${TAG}" ]]; then
            echo "::warning::Tag ${TAG} does not match the version v${GRADLE_VERSION} declared in app/build.gradle"
          fi
          echo "tag_name=${TAG}" >> "${GITHUB_OUTPUT}"

      - name: Publish draft release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag_name }}
          name: ${{ steps.release_tag.outputs.tag_name }}
          target_commitish: ${{ github.sha }}
          draft: true
          prerelease: false
          generate_release_notes: true
          files: |
            app/build/outputs/apk/release/*.apk
            app/src/main/assets/fmbin-*
